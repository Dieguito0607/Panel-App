<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controlador de Parada Inteligente</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 700px;
      margin: 0 auto;
    }
    h1 {
      color: #38bdf8;
      text-align: center;
      margin-bottom: 25px;
      font-size: 1.8rem;
    }
    .card {
      background: #1e293b;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid #334155;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }
    .card h2 {
      margin-top: 0;
      color: #f59e0b;
      font-size: 1.25rem;
      border-bottom: 1px solid #334155;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-top: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      color: #cbd5e1;
    }
    input, select, button {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      font-size: 1rem;
      outline: none;
    }
    input:focus, select:focus {
      border-color: #38bdf8;
    }
    button {
      background: #2563eb;
      font-weight: bold;
      cursor: pointer;
      border: none;
      margin-top: 15px;
      transition: background 0.2s ease;
    }
    button:hover {
      background: #1d4ed8;
    }
    .btn-danger {
      background: #dc2626;
    }
    .btn-danger:hover {
      background: #b91c1c;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    @media (max-width: 600px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎛️ Control de Medios - Parada Inteligente</h1>

    <!-- Control de Radio FM / Online -->
    <div class="card">
      <h2>📻 Radio en Vivo (Audio)</h2>
      
      <label for="radioSelect">Seleccionar Emisora Preconfigurada:</label>
      <select id="radioSelect">
        <option value="">-- Seleccionar o ingresar URL manual --</option>
        <option value="https://stream.zeno.fm/f3231eb93uquv">Emisora Local FM 1</option>
        <option value="https://stream.zeno.fm/0883398488000">Emisora Noticias / Deporte</option>
      </select>

      <label for="radioUrl">O ingresar URL de Radio (Icecast / MP3 Stream):</label>
      <input type="text" id="radioUrl" placeholder="https://stream.ejemplo.com/radio.mp3">

      <div class="grid">
        <button id="btnPlayRadio">▶ Transmitir Radio</button>
        <button id="btnStopRadio" class="btn-danger">⏹ Apagar Radio</button>
      </div>
    </div>

    <!-- Control de Video Streaming -->
    <div class="card">
      <h2>📺 Streaming de Video en Vivo</h2>
      
      <label for="streamUrl">URL de Transmisión (YouTube Embed, HLS .m3u8 o Video directo):</label>
      <input type="text" id="streamUrl" placeholder="https://www.youtube.com/embed/LIVE_ID o http://.../live.m3u8">

      <label for="streamTarget">Enviar Transmisión a:</label>
      <select id="streamTarget">
        <option value="publicidad">Televisor 2 (Pantalla Publicitaria)</option>
        <option value="panel">Televisor 1 (Panel Dividido)</option>
        <option value="both">Ambos Televisores</option>
      </select>

      <div class="grid">
        <button id="btnPlayStream">🎬 Iniciar Streaming</button>
        <button id="btnStopStream" class="btn-danger">⏹ Detener Streaming</button>
      </div>
    </div>

    <!-- Restablecer Todo -->
    <div class="card">
      <h2>🔄 Estado de Pantallas</h2>
      <button id="btnReset" class="btn-danger">Restablecer Pantallas a Modo Normal (Publicidad / Rutas)</button>
    </div>
  </div>

<script type="module">
  import { sendControlCommand, CONTROL_ACTIONS } from "../shared/controller-sync.js";

  const radioSelect = document.getElementById("radioSelect");
  const radioUrl = document.getElementById("radioUrl");
  const streamUrl = document.getElementById("streamUrl");
  const streamTarget = document.getElementById("streamTarget");

  document.getElementById("btnPlayRadio").addEventListener("click", () => {
    const url = radioUrl.value.trim() || radioSelect.value;
    if (!url) {
      alert("Por favor ingresa o selecciona una URL de radio.");
      return;
    }
    // Al sintonizar radio, enviamos SET_RADIO que silenciará todo en las pantallas
    sendControlCommand(CONTROL_ACTIONS.SET_RADIO, { url });
  });

  document.getElementById("btnStopRadio").addEventListener("click", () => {
    sendControlCommand(CONTROL_ACTIONS.STOP_RADIO);
  });

  document.getElementById("btnPlayStream").addEventListener("click", () => {
    const url = streamUrl.value.trim();
    const target = streamTarget.value;
    if (!url) {
      alert("Por favor ingresa una URL de streaming.");
      return;
    }
    sendControlCommand(CONTROL_ACTIONS.SET_STREAM, { url, target });
  });

  document.getElementById("btnStopStream").addEventListener("click", () => {
    sendControlCommand(CONTROL_ACTIONS.STOP_STREAM);
  });

  document.getElementById("btnReset").addEventListener("click", () => {
    sendControlCommand(CONTROL_ACTIONS.RESET_ALL);
  });
</script>
</body>
</html>
