<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Televisor 2 - Publicidad / Streaming</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden;
    }

    video, iframe {
      width: 100vw;
      height: 100vh;
      border: none;
      object-fit: cover;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }

    #streamFrame {
      display: none;
      z-index: 10;
    }
  </style>
</head>
<body>

  <video id="ad" preload="auto" muted autoplay loop playsinline></video>
  
  <iframe 
    id="streamFrame" 
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
    referrerpolicy="strict-origin-when-cross-origin"
    allowfullscreen>
  </iframe>

  <audio id="radioPlayer" style="display:none;"></audio>

  <script type="module">
    import { VIDEO_URL } from "../shared/config.js";
    import { listenControlCommands, CONTROL_ACTIONS } from "../shared/controller-sync.js";

    const video = document.getElementById("ad");
    const streamFrame = document.getElementById("streamFrame");
    const radioPlayer = document.getElementById("radioPlayer");

    let modoActual = "normal"; // "normal" | "radio" | "stream"

    // ─── VIDEO PUBLICITARIO ──────────────────────────────────────────
    function loadAdVideo() {
      if (!video.src || video.src === "" || video.src === window.location.href) {
        video.src = VIDEO_URL;
        video.load();
      }
    }
    loadAdVideo();

    video.addEventListener("loadedmetadata", () => {
      const portrait = video.videoHeight > video.videoWidth;
      video.style.objectFit = portrait ? "contain" : "cover";
    });

    function ensureVideoPlaying() {
      if (modoActual !== "normal") return;
      if (streamFrame.src) return;
      if (video.paused) video.play().catch(() => {});
    }

    video.addEventListener("canplay", ensureVideoPlaying);
    video.addEventListener("loadeddata", ensureVideoPlaying);
    ensureVideoPlaying();
    setTimeout(ensureVideoPlaying, 1000);
    setTimeout(ensureVideoPlaying, 3000);

    // ─── HELPERS ─────────────────────────────────────────────────────
    function formatStreamUrl(url) {
      if (!url) return "";
      let videoId = "";
      if (url.includes("v=")) videoId = url.split("v=")[1]?.split("&")[0];
      else if (url.includes("youtu.be/")) videoId = url.split("youtu.be/")[1]?.split("?")[0];
      else if (url.includes("youtube.com/live/")) videoId = url.split("youtube.com/live/")[1]?.split("?")[0];
      else if (url.includes("embed/")) videoId = url.split("embed/")[1]?.split("?")[0];

      if (videoId) {
        const origin = encodeURIComponent(window.location.origin);
        return `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=0&enablejsapi=1&origin=${origin}`;
      }
      return url;
    }

    function detenerRadioTotal() {
      try {
        radioPlayer.pause();
        radioPlayer.currentTime = 0;
        radioPlayer.removeAttribute("src");
        radioPlayer.load();
      } catch (e) {
        console.warn("Error al detener radio:", e);
      }
    }

    function detenerStreamTotal() {
      try {
        streamFrame.src = "";
        streamFrame.style.display = "none";
      } catch (e) {
        console.warn("Error al detener stream:", e);
      }
    }

    // 🔄 Vuelve el video publicitario a su estado normal (sonando desde el segundo 0)
    function restaurarVideoPublicitario() {
      video.muted = false;
      video.pause();
      video.currentTime = 0;
      loadAdVideo();
      video.load();
      video.play().catch(() => {});
    }

    // ─── MODOS ───────────────────────────────────────────────────────
    function entrarModoNormal() {
      modoActual = "normal";
      detenerRadioTotal();
      detenerStreamTotal();
      restaurarVideoPublicitario();
    }

    // 🔇 MODO RADIO: corta stream, vuelve el video publicitario a normal,
    //    pero lo deja muteado, y suena SOLO la radio.
    function entrarModoRadio(url) {
      modoActual = "radio";

      // 1. Cortar stream completamente y devolver el video publicitario a su
      //    estado normal (visible en pantalla, desde el segundo 0, pero mudo).
      detenerStreamTotal();
      restaurarVideoPublicitario();
      video.muted = true;   // el video se ve pero no suena

      // 2. Reproducir radio
      detenerRadioTotal();
      radioPlayer.src = url;
      radioPlayer.muted = false;
      radioPlayer.volume = 1;
      radioPlayer.play().catch((e) => console.warn("Error al reproducir radio:", e));
    }

    // 🎬 MODO STREAM: corta radio, detiene video publicitario y muestra el stream
    function entrarModoStream(url, target) {
      modoActual = "stream";

      // 1. Cortar radio
      detenerRadioTotal();

      // 2. Silenciar y pausar video publicitario (no lo reiniciamos aún;
      //    se reiniciará cuando se detenga el stream)
      video.muted = true;
      video.pause();

      // 3. Mostrar stream si va a esta pantalla
      if (target === "publicidad" || target === "both") {
        streamFrame.src = formatStreamUrl(url);
        streamFrame.style.display = "block";
      } else {
        detenerStreamTotal();
      }
    }

    // ─── ESCUCHAR COMANDOS ───────────────────────────────────────────
    listenControlCommands((action, payload) => {
      console.log("Publicidad recibió comando:", action, payload, "| modo:", modoActual);

      if (action === CONTROL_ACTIONS.SET_RADIO) {
        entrarModoRadio(payload.url);
      }
      else if (action === CONTROL_ACTIONS.STOP_RADIO) {
        entrarModoNormal();
      }
      else if (action === CONTROL_ACTIONS.SET_STREAM) {
        entrarModoStream(payload.url, payload.target);
      }
      else if (action === CONTROL_ACTIONS.STOP_STREAM) {
        entrarModoNormal();
      }
      else if (action === CONTROL_ACTIONS.RESET_ALL) {
        entrarModoNormal();
      }
      else if (action === CONTROL_ACTIONS.RELOAD_SCREEN) {
        if (!payload || payload.target === "publicidad" || payload.target === "both") {
          const url = new URL(window.location.href);
          url.searchParams.set("_r", Date.now().toString());
          window.location.replace(url.toString());
        }
      }
    });
  </script>
</body>
</html>
