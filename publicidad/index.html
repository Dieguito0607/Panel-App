<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Televisor 2 - Publicidad / Streaming</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden;
    }

    video, iframe {
      width: 100vw;
      height: 100vh;
      border: none;
      object-fit: cover;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }

    #streamFrame {
      display: none;
      z-index: 10;
    }
  </style>
</head>
<body>

  <!-- Video publicitario base -->
  <video id="ad" preload="auto" muted autoplay loop playsinline></video>

  <!-- Frame para transmisión en vivo (solo Televisor 2) -->
  <iframe 
    id="streamFrame" 
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
    referrerpolicy="strict-origin-when-cross-origin"
    allowfullscreen>
  </iframe>

  <!-- ❌ Ya NO hay radioPlayer aquí: la radio es del Televisor 1 -->

  <script type="module">
    import { VIDEO_URL } from "../shared/config.js";
    import { listenControlCommands, CONTROL_ACTIONS } from "../shared/controller-sync.js";

    const video = document.getElementById("ad");
    const streamFrame = document.getElementById("streamFrame");

    let modoActual = "normal"; // "normal" | "stream"

    // ─── VIDEO PUBLICITARIO ──────────────────────────────────────────
    function loadAdVideo() {
      if (!video.src || video.src === "" || video.src === window.location.href) {
        video.src = VIDEO_URL;
        video.load();
      }
    }
    loadAdVideo();

    video.addEventListener("loadedmetadata", () => {
      const portrait = video.videoHeight > video.videoWidth;
      video.style.objectFit = portrait ? "contain" : "cover";
    });

    function ensureVideoPlaying() {
      if (modoActual !== "normal") return;
      if (streamFrame.src) return;
      if (video.paused) video.play().catch(() => {});
    }

    video.addEventListener("canplay", ensureVideoPlaying);
    video.addEventListener("loadeddata", ensureVideoPlaying);
    ensureVideoPlaying();
    setTimeout(ensureVideoPlaying, 1000);
    setTimeout(ensureVideoPlaying, 3000);

    // ─── HELPERS ─────────────────────────────────────────────────────
    function formatStreamUrl(url) {
      if (!url) return "";
      let videoId = "";
      if (url.includes("v=")) videoId = url.split("v=")[1]?.split("&")[0];
      else if (url.includes("youtu.be/")) videoId = url.split("youtu.be/")[1]?.split("?")[0];
      else if (url.includes("youtube.com/live/")) videoId = url.split("youtube.com/live/")[1]?.split("?")[0];
      else if (url.includes("embed/")) videoId = url.split("embed/")[1]?.split("?")[0];

      if (videoId) {
        const origin = encodeURIComponent(window.location.origin);
        return `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=0&enablejsapi=1&origin=${origin}`;
      }
      return url;
    }

    function detenerStreamTotal() {
      try {
        streamFrame.src = "";
        streamFrame.style.display = "none";
      } catch (e) {
        console.warn("Error al detener stream:", e);
      }
    }

    function restaurarVideoPublicitario() {
      video.muted = false;
      video.pause();
      video.currentTime = 0;
      loadAdVideo();
      video.load();
      video.play().catch(() => {});
    }

    // ─── MODOS ───────────────────────────────────────────────────────
    function entrarModoNormal() {
      modoActual = "normal";
      detenerStreamTotal();
      restaurarVideoPublicitario();
    }

    // 🎬 MODO STREAM: corta el video publicitario y muestra el stream
    function entrarModoStream(url) {
      modoActual = "stream";

      // Pausar y mutear el video publicitario
      video.muted = true;
      video.pause();

      // Mostrar stream
      streamFrame.src = formatStreamUrl(url);
      streamFrame.style.display = "block";
    }

    // ─── ESCUCHAR COMANDOS ───────────────────────────────────────────
    // ⚠️ La publicidad SOLO reacciona a comandos de STREAM y RESET.
    //    Ignora SET_RADIO / STOP_RADIO porque la radio es del Televisor 1.
    listenControlCommands((action, payload) => {
      console.log("Publicidad (TV2) recibió comando:", action, payload, "| modo:", modoActual);

      if (action === CONTROL_ACTIONS.SET_STREAM) {
        // El stream siempre va a esta pantalla (ya no hay selector de target)
        entrarModoStream(payload.url);
      }
      else if (action === CONTROL_ACTIONS.STOP_STREAM) {
        entrarModoNormal();
      }
      else if (action === CONTROL_ACTIONS.RESET_ALL) {
        entrarModoNormal();
      }
      else if (action === CONTROL_ACTIONS.RELOAD_SCREEN) {
        if (!payload || payload.target === "publicidad" || payload.target === "both") {
          const url = new URL(window.location.href);
          url.searchParams.set("_r", Date.now().toString());
          window.location.replace(url.toString());
        }
      }
      // Los comandos SET_RADIO / STOP_RADIO se ignoran a propósito aquí.
    });
  </script>
</body>
</html>
