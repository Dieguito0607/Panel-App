<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Televisor 2 - Publicidad / Streaming</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden;
    }

    video, iframe {
      width: 100vw;
      height: 100vh;
      border: none;
      object-fit: cover;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }

    #streamFrame {
      display: none;
      z-index: 10;
    }
  </style>
</head>
<body>

  <!-- Video publicitario base -->
  <video id="ad" preload="auto" muted autoplay loop playsinline></video>
  
  <!-- Frame para transmisión en vivo -->
  <iframe 
    id="streamFrame" 
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
    referrerpolicy="strict-origin-when-cross-origin"
    allowfullscreen>
  </iframe>

  <!-- Reproductor de Radio oculto si se asigna a esta pantalla -->
  <audio id="radioPlayer" style="display:none;"></audio>

  <script type="module">
    import { VIDEO_URL } from "../shared/config.js";
    import { listenControlCommands, CONTROL_ACTIONS } from "../shared/controller-sync.js";

    const video = document.getElementById("ad");
    const streamFrame = document.getElementById("streamFrame");
    const radioPlayer = document.getElementById("radioPlayer");

    // ─── CARGA DEL VIDEO PUBLICITARIO ────────────────────────────────
    function loadAdVideo() {
      if (!video.src || video.src === "" || video.src === window.location.href) {
        video.src = VIDEO_URL;
        video.load();
      }
    }

    loadAdVideo();

    video.addEventListener("loadedmetadata", () => {
      const portrait = video.videoHeight > video.videoWidth;
      video.style.objectFit = portrait ? "contain" : "cover";
    });

    // ─── ASEGURAR REPRODUCCIÓN (evita pantalla negra) ────────────────
    function ensureVideoPlaying() {
      // Si hay stream activo, no tocar el video
      if (streamFrame.src) return;
      // Si hay radio activa, no reproducir el video (pero sí mostrarlo)
      if (radioPlayer.src && !radioPlayer.paused) {
        // Mantener el video pausado pero visible (último frame)
        return;
      }
      if (video.paused) {
        video.play().catch(() => {});
      }
    }

    // Reintenta reproducir varias veces tras cargar (por si el navegador
    // del Smart TV bloquea el primer play)
    video.addEventListener("canplay", ensureVideoPlaying);
    video.addEventListener("loadeddata", ensureVideoPlaying);
    ensureVideoPlaying();
    setTimeout(ensureVideoPlaying, 1000);
    setTimeout(ensureVideoPlaying, 3000);

    // ─── FORMATEAR URL DE STREAM ─────────────────────────────────────
    function formatStreamUrl(url) {
      if (!url) return "";
      let videoId = "";
      if (url.includes("v=")) videoId = url.split("v=")[1]?.split("&")[0];
      else if (url.includes("youtu.be/")) videoId = url.split("youtu.be/")[1]?.split("?")[0];
      else if (url.includes("youtube.com/live/")) videoId = url.split("youtube.com/live/")[1]?.split("?")[0];
      else if (url.includes("embed/")) videoId = url.split("embed/")[1]?.split("?")[0];

      if (videoId) {
        const origin = encodeURIComponent(window.location.origin);
        return `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=0&enablejsapi=1&origin=${origin}`;
      }
      return url;
    }

    // ─── RECARGA CON CACHE-BUSTING ───────────────────────────────────
    function reloadWithCacheBust() {
      const url = new URL(window.location.href);
      url.searchParams.set("_r", Date.now().toString());
      window.location.replace(url.toString());
    }

    // ─── ESCUCHAR COMANDOS DESDE EL CONTROLADOR ──────────────────────
    listenControlCommands((action, payload) => {

      // --- RADIO EN VIVO ---
      if (action === CONTROL_ACTIONS.SET_RADIO) {
        // Silenciar todo antes de reproducir radio
        video.muted = true;
        video.pause();
        if (streamFrame.src) {
          streamFrame.src = "";
          streamFrame.style.display = "none";
        }
        radioPlayer.src = payload.url;
        radioPlayer.play().catch(() => {});
      }
      else if (action === CONTROL_ACTIONS.STOP_RADIO) {
        radioPlayer.pause();
        radioPlayer.src = "";
        video.muted = false;
        loadAdVideo();
        ensureVideoPlaying();
      }

      // --- STREAMING DE VIDEO ---
      else if (action === CONTROL_ACTIONS.SET_STREAM && (payload.target === "publicidad" || payload.target === "both")) {
        radioPlayer.pause();
        radioPlayer.src = "";
        video.pause();
        streamFrame.src = formatStreamUrl(payload.url);
        streamFrame.style.display = "block";
      } 
      else if (action === CONTROL_ACTIONS.STOP_STREAM || action === CONTROL_ACTIONS.RESET_ALL) {
        radioPlayer.pause();
        radioPlayer.src = "";
        streamFrame.src = "";
        streamFrame.style.display = "none";
        video.muted = false;
        loadAdVideo();
        ensureVideoPlaying();
      }

      // --- RECARGA FORZADA ---
      else if (action === CONTROL_ACTIONS.RELOAD_SCREEN) {
        if (!payload || payload.target === "publicidad" || payload.target === "both") {
          // Pequeña espera para que RESET_ALL se procese antes de recargar
          setTimeout(() => {
            reloadWithCacheBust();
          }, 500);
        }
      }
    });
  </script>
</body>
</html>
