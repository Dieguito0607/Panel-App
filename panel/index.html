<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panel</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #111;
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }

    .grid {
      display: grid;
      grid-template-columns: 2fr 1.5fr 1.5fr;
      grid-template-rows: 1fr 1fr;
      grid-template-areas:
        "izq  top-der  top-der"
        "izq  video    bot-der";
      width: 100vw;
      height: 100vh;
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      margin: 0;
      padding: 0;
      overflow: hidden;
      color: #666;
      font-size: 2vw;
      letter-spacing: 0.05em;
    }

    .cell-izq {
      grid-area: izq;
      padding: 0;
      margin: 0;
      border: none;
    }

    .cell-top-der {
      grid-area: top-der;
      border: 1px solid #222;
    }

    .cell-slide {
      grid-area: video;
      padding: 0;
      margin: 0;
      border: none;
    }

    .cell-video {
      grid-area: bot-der;
      padding: 0;
      margin: 0;
      border: none;
      background: #000;
      transform: translateZ(0);
      will-change: transform;
    }

    .cell-izq iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      transform: translateZ(0);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: translateZ(0);
      will-change: transform;
    }
  </style>
</head>

<body>
  <div class="grid">
    <div class="cell cell-izq">
      <iframe src="https://mapahospital-ida.vercel.app/" title="BusTrack Realtime" allowfullscreen></iframe>
    </div>
    <div class="cell cell-top-der">En proceso</div>
    <div class="cell cell-slide">
      <div id="rutas-slide" style="width: 100%; height: 100%;"></div>
    </div>
    <div class="cell cell-video">
      <video id="ad" preload="auto" muted autoplay loop playsinline></video>
    </div>
  </div>

  <!-- Audio de fondo continuo -->
  <audio id="bg-audio" preload="auto" loop></audio>

  <script type="module">
  import { VIDEO_URL_PANEL, AUDIO_URL_FONDO } from "../shared/config.js";
  import { initRoutesSlideshow } from "../shared/routes-slideshow.js";
  import { listenControlCommands, CONTROL_ACTIONS } from "../shared/controller-sync.js";

  const video = document.getElementById("ad");
  const audio = document.getElementById("bg-audio");
  
  // Crear reproductor de radio dinámicamente
  const radioPlayer = new Audio();
  radioPlayer.crossOrigin = "anonymous";
  radioPlayer.preload = "auto";

  video.src = VIDEO_URL_PANEL;
  video.style.objectFit = "cover";

  // ─── FUNCIONES DE CONTROL DE AUDIO ───────────────────────────────
  let radioActiva = false;

  function silenciarTodoLocal() {
    // Silenciar video
    video.muted = true;
    // Pausar audio de fondo
    audio.pause();
    // Pausar cualquier radio previa
    radioPlayer.pause();
    radioPlayer.src = "";
  }

  function reproducirRadio(url) {
    radioActiva = true;
    // 1. Silenciar TODAS las fuentes locales
    video.muted = true;
    audio.pause();
    audio.currentTime = 0;
    // 2. Reproducir radio
    radioPlayer.src = url;
    radioPlayer.play().catch((e) => console.warn("Error al reproducir radio:", e));
  }

  function detenerRadio() {
    radioActiva = false;
    radioPlayer.pause();
    radioPlayer.src = "";
    // Restaurar audio de fondo
    startAudio();
  }

  function restaurarTodo() {
    radioActiva = false;
    radioPlayer.pause();
    radioPlayer.src = "";
    video.muted = false; // o true según prefieras
    startAudio();
    startPlayback();
  }

  // ─── REPRODUCCIÓN BASE ───────────────────────────────────────────
  const startPlayback = () => {
    if (video.paused) video.play().catch(() => {});
  };
  startPlayback();
  video.addEventListener("canplay", startPlayback);

  const startAudio = () => {
    if (radioActiva) return; // No reproducir audio de fondo si hay radio
    if (audio.paused) audio.play().catch(() => {});
  };
  startAudio();
  audio.addEventListener("canplay", startAudio);

  // ─── ESCUCHAR COMANDOS DEL CONTROLADOR ───────────────────────────
  listenControlCommands((action, payload) => {
    console.log("Panel recibió comando:", action, payload);

    if (action === CONTROL_ACTIONS.SET_RADIO) {
      reproducirRadio(payload.url);
    } else if (action === CONTROL_ACTIONS.STOP_RADIO) {
      detenerRadio();
    } else if (action === CONTROL_ACTIONS.RESET_ALL) {
      restaurarTodo();
    } else if (action === CONTROL_ACTIONS.MUTE_ALL) {
      silenciarTodoLocal();
    } else if (action === CONTROL_ACTIONS.SET_STREAM) {
      // Si llega un stream al panel, silenciar radio también
      if (payload.target === "panel" || payload.target === "both") {
        radioPlayer.pause();
        radioPlayer.src = "";
        radioActiva = false;
      }
    }
  });

  // ─── DESBLOQUEO DE AUDIO (Smart TV) ──────────────────────────────
  const unlockAudio = () => {
    if (!radioActiva) startAudio();
  };
  window.addEventListener("click", unlockAudio, { once: true });
  window.addEventListener("touchstart", unlockAudio, { once: true });
  window.addEventListener("keydown", unlockAudio, { once: true });

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) {
      startPlayback();
      if (!radioActiva) startAudio();
    }
  });

  initRoutesSlideshow(document.getElementById("rutas-slide"), { intervalMs: 7000 });
</script>
</body>

</html>
