<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Televisor 1 - Panel</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #111;
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }

    .grid {
      display: grid;
      grid-template-columns: 2fr 1.5fr 1.5fr;
      grid-template-rows: 1fr 1fr;
      grid-template-areas:
        "izq  top-der  top-der"
        "izq  video    bot-der";
      width: 100vw;
      height: 100vh;
    }

    .cell { display: flex; align-items: center; justify-content: center; border: none; margin: 0; padding: 0; overflow: hidden; color: #666; font-size: 2vw; letter-spacing: 0.05em; }
    .cell-izq { grid-area: izq; }
    .cell-top-der { grid-area: top-der; border: 1px solid #222; }
    .cell-slide { grid-area: video; }
    .cell-video { grid-area: bot-der; background: #000; transform: translateZ(0); will-change: transform; }

    .cell-izq iframe { width: 100%; height: 100%; border: none; display: block; }

    video { width: 100%; height: 100%; object-fit: cover; display: block; }
  </style>
</head>

<body>
  <div class="grid">
    <div class="cell cell-izq">
      <iframe src="https://mapahospital-ida.vercel.app/" title="BusTrack Realtime" allowfullscreen></iframe>
    </div>
    <div class="cell cell-top-der">En proceso</div>
    <div class="cell cell-slide">
      <div id="rutas-slide" style="width: 100%; height: 100%;"></div>
    </div>
    <div class="cell cell-video">
      <video id="ad" preload="auto" muted autoplay loop playsinline></video>
    </div>
  </div>

  <audio id="bg-audio" preload="auto" loop></audio>

  <script type="module">
    import { VIDEO_URL_PANEL, AUDIO_URL_FONDO } from "../shared/config.js";
    import { initRoutesSlideshow } from "../shared/routes-slideshow.js";
    import { listenControlCommands, CONTROL_ACTIONS } from "../shared/controller-sync.js";

    const video = document.getElementById("ad");
    const audio = document.getElementById("bg-audio");

    const radioPlayer = new Audio();
    radioPlayer.crossOrigin = "anonymous";
    radioPlayer.preload = "auto";

    let modoActual = "normal"; // "normal" | "radio"

    // ─── VIDEO PANEL ─────────────────────────────────────────────────
    video.src = VIDEO_URL_PANEL;
    video.style.objectFit = "cover";

    function startVideoPanel() {
      if (video.paused) video.play().catch(() => {});
    }
    startVideoPanel();
    video.addEventListener("canplay", startVideoPanel);

    // ─── AUDIO DE FONDO ──────────────────────────────────────────────
    function asignarAudioFondo() {
      if (!audio.src || audio.src === "" || audio.src === window.location.href) {
        audio.src = AUDIO_URL_FONDO;
      }
    }

    function iniciarAudioFondo() {
      if (modoActual !== "normal") return;
      asignarAudioFondo();
      audio.muted = false;
      audio.volume = 1;
      if (audio.paused) audio.play().catch(() => {});
    }

    function detenerAudioFondo() {
      try {
        audio.pause();
        audio.currentTime = 0;
        audio.muted = true;
        audio.volume = 0;
        audio.removeAttribute("src");
        audio.load();
      } catch (e) {
        console.warn("Error al detener audio de fondo:", e);
      }
    }

    iniciarAudioFondo();

    audio.addEventListener("canplay", () => {
      if (modoActual === "normal" && audio.paused) {
        audio.play().catch(() => {});
      }
    });

    // ─── HELPERS ─────────────────────────────────────────────────────
    function detenerRadioTotal() {
      try {
        radioPlayer.pause();
        radioPlayer.currentTime = 0;
        radioPlayer.removeAttribute("src");
        radioPlayer.load();
      } catch (e) {
        console.warn("Error al detener radio:", e);
      }
    }

    // ─── MODOS ───────────────────────────────────────────────────────
    function entrarModoNormal() {
      modoActual = "normal";
      detenerRadioTotal();
      video.muted = true; // el video del panel siempre está muteado
      video.play().catch(() => {});
      iniciarAudioFondo();
    }

    // 🔇 MODO RADIO: solo suena la radio en este televisor
    function entrarModoRadio(url) {
      modoActual = "radio";
      detenerAudioFondo();
      video.muted = true;
      detenerRadioTotal();
      radioPlayer.src = url;
      radioPlayer.muted = false;
      radioPlayer.volume = 1;
      radioPlayer.play().catch((e) => console.warn("Error al reproducir radio:", e));
    }

    // ─── ESCUCHAR COMANDOS ───────────────────────────────────────────
    listenControlCommands((action, payload) => {
      console.log("Panel (TV1) recibió comando:", action, payload, "| modo:", modoActual);

      if (action === CONTROL_ACTIONS.SET_RADIO) {
        entrarModoRadio(payload.url);
      }
      else if (action === CONTROL_ACTIONS.STOP_RADIO) {
        entrarModoNormal();
      }
      else if (action === CONTROL_ACTIONS.RESET_ALL) {
        entrarModoNormal();
      }
      else if (action === CONTROL_ACTIONS.RELOAD_SCREEN) {
        if (!payload || payload.target === "panel" || payload.target === "both") {
          const url = new URL(window.location.href);
          url.searchParams.set("_r", Date.now().toString());
          window.location.replace(url.toString());
        }
      }
      // SET_STREAM / STOP_STREAM se ignoran: el streaming es del TV2
    });

    // ─── DESBLOQUEO DE AUDIO ─────────────────────────────────────────
    const unlockAudio = () => {
      if (modoActual === "normal") iniciarAudioFondo();
      if (video.paused) video.play().catch(() => {});
    };
    window.addEventListener("click", unlockAudio, { once: true });
    window.addEventListener("touchstart", unlockAudio, { once: true });
    window.addEventListener("keydown", unlockAudio, { once: true });

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) return;
      if (modoActual === "normal") {
        iniciarAudioFondo();
        startVideoPanel();
      } else if (modoActual === "radio") {
        if (radioPlayer.paused && radioPlayer.src) {
          radioPlayer.play().catch(() => {});
        }
      }
    });

    initRoutesSlideshow(document.getElementById("rutas-slide"), { intervalMs: 7000 });
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    }
  </script>
</body>

</html>
