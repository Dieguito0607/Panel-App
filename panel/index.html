<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panel</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #111;
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }

    .grid {
      display: grid;
      grid-template-columns: 2fr 1.5fr 1.5fr;
      grid-template-rows: 1fr 1fr;
      grid-template-areas:
        "izq  top-der  top-der"
        "izq  video    bot-der";
      width: 100vw;
      height: 100vh;
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      margin: 0;
      padding: 0;
      overflow: hidden;
      color: #666;
      font-size: 2vw;
      letter-spacing: 0.05em;
    }

    .cell-izq {
      grid-area: izq;
      padding: 0;
      margin: 0;
      border: none;
    }

    .cell-top-der {
      grid-area: top-der;
      border: 1px solid #222;
    }

    .cell-slide {
      grid-area: video;
      padding: 0;
      margin: 0;
      border: none;
    }

    .cell-video {
      grid-area: bot-der;
      padding: 0;
      margin: 0;
      border: none;
      background: #000;
      transform: translateZ(0);
      will-change: transform;
    }

    .cell-izq iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      transform: translateZ(0);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: translateZ(0);
      will-change: transform;
    }

    /* Overlay para stream en vivo (oculto por defecto) */
    #streamFrame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      background: #000;
      display: none;
      z-index: 9999;
    }
  </style>
</head>

<body>
  <div class="grid">
    <div class="cell cell-izq">
      <iframe src="https://mapahospital-ida.vercel.app/" title="BusTrack Realtime" allowfullscreen></iframe>
    </div>
    <div class="cell cell-top-der">En proceso</div>
    <div class="cell cell-slide">
      <div id="rutas-slide" style="width: 100%; height: 100%;"></div>
    </div>
    <div class="cell cell-video">
      <video id="ad" preload="auto" muted autoplay loop playsinline></video>
    </div>
  </div>

  <!-- Overlay para stream en vivo (solo si el stream va al panel) -->
  <iframe
    id="streamFrame"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    referrerpolicy="strict-origin-when-cross-origin"
    allowfullscreen>
  </iframe>

  <!-- Audio de fondo continuo -->
  <audio id="bg-audio" preload="auto" loop></audio>

  <script type="module">
    import { VIDEO_URL_PANEL, AUDIO_URL_FONDO } from "../shared/config.js";
    import { initRoutesSlideshow } from "../shared/routes-slideshow.js";
    import { listenControlCommands, CONTROL_ACTIONS } from "../shared/controller-sync.js";

    const video = document.getElementById("ad");
    const audio = document.getElementById("bg-audio");
    const streamFrame = document.getElementById("streamFrame");

    // Reproductor de radio dinámico
    const radioPlayer = new Audio();
    radioPlayer.crossOrigin = "anonymous";
    radioPlayer.preload = "auto";

    // ─── ESTADO GLOBAL ───────────────────────────────────────────────
    // "normal" | "radio" | "stream"
    let modoActual = "normal";

    // ─── VIDEO PANEL ─────────────────────────────────────────────────
    video.src = VIDEO_URL_PANEL;
    video.style.objectFit = "cover";

    function startVideoPanel() {
      if (video.paused) video.play().catch(() => {});
    }
    startVideoPanel();
    video.addEventListener("canplay", startVideoPanel);

    // ─── AUDIO DE FONDO ──────────────────────────────────────────────
    // 🔑 CLAVE: no asignamos el src al principio. Solo lo asignamos
    // cuando entramos en modo normal. Así, en modo radio/stream, el
    // audio NO TIENE SRC y es IMPOSIBLE que suene.
    function asignarAudioFondo() {
      if (audio.src !== AUDIO_URL_FONDO && !audio.src.endsWith("fondo.mp3")) {
        audio.src = AUDIO_URL_FONDO;
      }
    }

    function iniciarAudioFondo() {
      if (modoActual !== "normal") return;
      asignarAudioFondo();
      audio.muted = false;
      audio.volume = 1;
      if (audio.paused) {
        audio.play().catch(() => {});
      }
    }

function detenerAudioFondo() {
  try {
    audio.pause();
    audio.currentTime = 0;
    audio.muted = true;
    audio.volume = 0;
    audio.removeAttribute("src");
    audio.load();
    // Reemplazar el nodo por uno nuevo: garantiza que el buffer muere
    const nuevoAudio = audio.cloneNode(false);
    nuevoAudio.id = "bg-audio";
    nuevoAudio.preload = "auto";
    nuevoAudio.loop = true;
    audio.parentNode.replaceChild(nuevoAudio, audio);
    audio = nuevoAudio;   // ← necesitas declarar `audio` con `let`, no `const`
  } catch (e) {
    console.warn("Error al detener audio de fondo:", e);
  }
}

    // Arrancar audio de fondo solo si estamos en modo normal
    iniciarAudioFondo();

    // ⚠️ Este listener NO debe reanudar el audio si estamos en radio/stream
    audio.addEventListener("canplay", () => {
      if (modoActual === "normal" && audio.paused) {
        audio.play().catch(() => {});
      }
    });

    // ─── RECARGA CON CACHE-BUSTING ───────────────────────────────────
    function reloadWithCacheBust() {
      const url = new URL(window.location.href);
      url.searchParams.set("_r", Date.now().toString());
      window.location.replace(url.toString());
    }

    // ─── FORMATEAR URL DE STREAM ─────────────────────────────────────
    function formatStreamUrl(url) {
      if (!url) return "";
      let videoId = "";
      if (url.includes("v=")) videoId = url.split("v=")[1]?.split("&")[0];
      else if (url.includes("youtu.be/")) videoId = url.split("youtu.be/")[1]?.split("?")[0];
      else if (url.includes("youtube.com/live/")) videoId = url.split("youtube.com/live/")[1]?.split("?")[0];
      else if (url.includes("embed/")) videoId = url.split("embed/")[1]?.split("?")[0];

      if (videoId) {
        const origin = encodeURIComponent(window.location.origin);
        return `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=0&enablejsapi=1&origin=${origin}`;
      }
      return url;
    }

    // ─── FUNCIONES DE CAMBIO DE MODO ─────────────────────────────────
    function entrarModoNormal() {
      modoActual = "normal";
      // Detener radio
      radioPlayer.pause();
      radioPlayer.removeAttribute("src");
      radioPlayer.load();
      // Detener stream
      streamFrame.src = "";
      streamFrame.style.display = "none";
      // Restaurar video del panel
      video.muted = false;
      video.play().catch(() => {});
      // Restaurar audio de fondo
      iniciarAudioFondo();
    }

    function entrarModoRadio(url) {
      modoActual = "radio";
      // 🔑 PRIMERO detener audio de fondo (antes de cualquier otra cosa)
      detenerAudioFondo();
      // Silenciar video del panel
      video.muted = true;
      // Detener stream si había
      streamFrame.src = "";
      streamFrame.style.display = "none";
      // Reproducir radio
      radioPlayer.src = url;
      radioPlayer.muted = false;
      radioPlayer.volume = 1;
      radioPlayer.play().catch((e) => console.warn("Error al reproducir radio:", e));
    }

    function entrarModoStream(url) {
      modoActual = "stream";
      // 🔑 PRIMERO detener audio de fondo
      detenerAudioFondo();
      // Silenciar video del panel
      video.muted = true;
      // Detener radio si había
      radioPlayer.pause();
      radioPlayer.removeAttribute("src");
      radioPlayer.load();
      // Mostrar stream
      streamFrame.src = formatStreamUrl(url);
      streamFrame.style.display = "block";
    }

    // ─── ESCUCHAR COMANDOS ───────────────────────────────────────────
    listenControlCommands((action, payload) => {
      console.log("Panel recibió comando:", action, payload, "| modo actual:", modoActual);

      if (action === CONTROL_ACTIONS.SET_RADIO) {
        entrarModoRadio(payload.url);
      }
      else if (action === CONTROL_ACTIONS.STOP_RADIO) {
        entrarModoNormal();
      }
      else if (action === CONTROL_ACTIONS.SET_STREAM) {
        if (payload.target === "panel" || payload.target === "both") {
          entrarModoStream(payload.url);
        }
      }
      else if (action === CONTROL_ACTIONS.STOP_STREAM) {
        if (modoActual === "stream") {
          entrarModoNormal();
        }
      }
      else if (action === CONTROL_ACTIONS.RESET_ALL) {
        entrarModoNormal();
      }
      else if (action === CONTROL_ACTIONS.RELOAD_SCREEN) {
        if (!payload || payload.target === "panel" || payload.target === "both") {
          reloadWithCacheBust();
        }
      }
    });

    // ─── DESBLOQUEO DE AUDIO (Smart TV) ──────────────────────────────
    const unlockAudio = () => {
      if (modoActual === "normal") iniciarAudioFondo();
      if (video.paused && modoActual !== "stream") video.play().catch(() => {});
    };
    window.addEventListener("click", unlockAudio, { once: true });
    window.addEventListener("touchstart", unlockAudio, { once: true });
    window.addEventListener("keydown", unlockAudio, { once: true });

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) return;
      if (modoActual === "normal") {
        iniciarAudioFondo();
        startVideoPanel();
      } else if (modoActual === "radio") {
        if (radioPlayer.paused && radioPlayer.src) {
          radioPlayer.play().catch(() => {});
        }
      }
      // En modo stream no hacemos nada
    });

    initRoutesSlideshow(document.getElementById("rutas-slide"), { intervalMs: 7000 });
  </script>

  <!-- Registro del Service Worker para funcionamiento offline -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    }
  </script>
</body>

</html>
