<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Televisor 1 - Panel de Rutas</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: #0f172a;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    /* Contenido base del Panel */
    #panel-content {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* Capa de Streaming en vivo */
    #panel-stream-container {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9999;
      background: #000;
    }

    #panelStreamFrame {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Vista normal del Televisor 1 -->
  <div id="panel-content">
    <h1>🚌 Panel de Información y Rutas</h1>
    <p>Estado de ruta: Activo</p>
  </div>

  <!-- Contenedor para Streaming en Vivo (TV 1) -->
  <div id="panel-stream-container">
    <iframe 
      id="panelStreamFrame" 
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
      allowfullscreen>
    </iframe>
  </div>

  <!-- Reproductor de Radio oculto -->
  <audio id="radioPlayer" style="display:none;"></audio>

  <script type="module">
    import { listenControlCommands, CONTROL_ACTIONS } from "../shared/controller-sync.js";

    const radioPlayer = document.getElementById("radioPlayer");
    const streamContainer = document.getElementById("panel-stream-container");
    const streamFrame = document.getElementById("panelStreamFrame");
    const panelContent = document.getElementById("panel-content");

    // Formateador de URLs de YouTube
    function formatStreamUrl(url) {
      if (!url) return "";
      let videoId = "";
      if (url.includes("v=")) videoId = url.split("v=")[1]?.split("&")[0];
      else if (url.includes("youtu.be/")) videoId = url.split("youtu.be/")[1]?.split("?")[0];
      else if (url.includes("youtube.com/live/")) videoId = url.split("youtube.com/live/")[1]?.split("?")[0];
      else if (url.includes("embed/")) videoId = url.split("embed/")[1]?.split("?")[0];

      if (videoId) {
        const origin = encodeURIComponent(window.location.origin);
        return `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=0&enablejsapi=1&origin=${origin}`;
      }
      return url;
    }

    // Escuchar comandos desde Vercel
    listenControlCommands((action, payload) => {

      // --- RADIO EN VIVO ---
      if (action === CONTROL_ACTIONS.SET_RADIO) {
        radioPlayer.src = payload.url;
        radioPlayer.play().catch(err => console.error("Error reproduciendo radio:", err));
      } 
      else if (action === CONTROL_ACTIONS.STOP_RADIO) {
        radioPlayer.pause();
        radioPlayer.src = "";
      }

      // --- STREAMING DE VIDEO ---
      else if (action === CONTROL_ACTIONS.SET_STREAM && (payload.target === "panel" || payload.target === "both")) {
        radioPlayer.pause();
        streamFrame.src = formatStreamUrl(payload.url);
        streamContainer.style.display = "block";
      } 
      else if (action === CONTROL_ACTIONS.STOP_STREAM) {
        streamFrame.src = "";
        streamContainer.style.display = "none";
      }

      // --- RESTABLECER PANTALLA ---
      else if (action === CONTROL_ACTIONS.RESET_ALL) {
        radioPlayer.pause();
        radioPlayer.src = "";
        streamFrame.src = "";
        streamContainer.style.display = "none";
      }
    });
  </script>
</body>
</html>
